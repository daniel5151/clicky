[workspace]
resolver = "3"
members = ["clicky-core", "clicky-desktop", "clicky-web", "pprom", "relativity"]
default-members = ["clicky-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Daniel Prilik <danielprilik@gmail.com>", "Jean THOMAS <virgule@jeanthomas.me>"]

[workspace.dependencies]
# Internal crates
clicky-core = { path = "clicky-core" }
pprom = { path = "pprom" }
relativity = { path = "relativity" }

# External crates
anyhow = "1.0"
armv4t_emu = "0.1.3"
async-channel = "1.4"
async-timer = "1.0.0-beta.5"
bit_field = "0.10"
bitfields = "3.1.0"
blocking = "0.5"
bytemuck = "1.2"
byteorder = "1.3"
cfg-if = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
console_log = { version = "0.2", features = ["color"] }
either = "1.9.0"
fern = "0.5"
flate2 = "1.0"
futures = { version = "0.3", default-features = false }
futures-executor = "0.3"
gdbstub = "0.4"
gloo-timers = { version = "0.2", features = ["futures"] }
human-size = "0.4"
hxdmp = "0.2"
instant = "0.1"
log = "0.4"
minifb = "0.23"
num_enum = "0.5"
owo-colors = "4"
pin-utils = "0.1"
pretty_env_logger = "0.3"
static_assertions = "1.1"
stdrandom = "0.3.0"
structopt = "0.3"
thiserror = "1.0"
wasm-bindgen = "0.2.63"
xshell = "0.2"

[profile.release]
panic = "abort"
debug = true
